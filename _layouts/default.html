<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{page.title}}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-115742833-3"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="{{site.baseurl}}/images/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{site.baseurl}}/images/favicon.png">
  <link href="{{site.baseurl}}/assets/css/style.css" rel="stylesheet">
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'UA-115742833-3');
</script>
<meta name="google-site-verification" content="Wa8wriK4A64J_yCEmytg9vIs4ZQKWkDWaYwFio4TI-M" />
{% seo %}
  {% include schema-markup.html type="localbusiness" %}
</head>
<body class='page {{page.bodyClass}}'>
  {% include main-menu-mobile.html %}
  <div id="wrapper" class="wrapper">
    {% include header.html headerClass='header-extra' %}
    {{content}}
  </div>
  {% include footer.html %}
  {% include sub-footer.html %}
  <script type="text/javascript" src="{{ site.baseurl }}/assets/js/scripts.js"></script>
  <script>
  window.addEventListener('message', function(e) {
    if (e.data === 'scrollToBooking') {
      setTimeout(function() {
        var f = document.getElementById('bookingFrame');
        if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 600);
    }
  });
  </script>
  {% include google-analytics.html %}

  <!-- Chatbot Widget -->
  <div id="chatbot-root"></div>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/chatbot-widget.css">
  <script type="module" src="{{ site.baseurl }}/assets/js/chatbot-widget.js"></script>

</body>
</html>
